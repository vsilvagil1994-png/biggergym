<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Bigger Gym</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">
  <div class="login-card">
    <h2>🔐 Bigger Gym</h2>

    <input type="text" id="usuario" placeholder="Usuario">
    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="login()">Ingresar</button>

    <p id="errorLogin" style="color:red; margin-top:10px;"></p>

    <!-- ✅ LINK VISIBLE -->
    <p style="margin-top:15px; font-size:14px;">
      <a href="#" onclick="recuperarAcceso()" style="color:#FFD700; text-decoration:underline;">
        ¿Olvidaste tu usuario o contraseña?
      </a>
    </p>

    <!-- Texto de soporte (opcional pero pro) -->
    <p style="margin-top:8px; font-size:12px; color:#ccc;">
      Soporte técnico Bigger Gym
    </p>
  </div>
</div>

<script>
async function login() {
  const usuario = document.getElementById('usuario').value;
  const password = document.getElementById('password').value;
  const error = document.getElementById('errorLogin');

  error.textContent = '';

  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, password })
    });

    if (res.ok) {
      localStorage.setItem('logeado', 'true');
      window.location.href = 'index.html';
    } else {
      error.textContent = 'Usuario o contraseña incorrectos';
    }

  } catch (e) {
    error.textContent = 'Error de conexión con el servidor';
  }
}

function recuperarAcceso() {
  const telefono = '573208618664'; // TU NÚMERO
  const mensaje = encodeURIComponent(
    'Hola, soy usuario de Bigger Gym. Olvidé mi usuario o contraseña. ¿Me pueden ayudar por favor?'
  );

  const url = `https://wa.me/${telefono}?text=${mensaje}`;
  window.open(url, '_blank');
}
</script>

</body>
</html>
