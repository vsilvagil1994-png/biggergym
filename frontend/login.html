<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Bigger Gym</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">
  <h2>🔐 Bigger Gym</h2>

  <input type="text" id="usuario" placeholder="Usuario">
  <input type="password" id="password" placeholder="Contraseña">

  <button onclick="login()">Ingresar</button>

  <p id="errorLogin" style="color:red; margin-top:10px;"></p>
</div>

<p style="margin-top:10px; text-align:center;">
  <a href="#" onclick="recuperarAcceso()">¿Olvidaste tu usuario o contraseña?</a>
</p>

<script>
async function login() {
  const usuario = document.getElementById('usuario').value;
  const password = document.getElementById('password').value;
  const error = document.getElementById('errorLogin');

  error.textContent = '';

  try {
    const res = await fetch('/login', {   // ✅ Ruta relativa para Render
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, password })
    });

    if (res.ok) {
      localStorage.setItem('logeado', 'true');
      window.location.href = 'index.html';
    } else {
      error.textContent = 'Usuario o contraseña incorrectos';
    }

  } catch (e) {
    error.textContent = 'Error de conexión con el servidor';
  }
}

// ===============================
// RECUPERAR ACCESO POR WHATSAPP
// ===============================
function recuperarAcceso() {
  const mensaje = `Hola, necesito recuperar mi usuario o contraseña del sistema BiggerGym.

Nombre:
Nombre del gimnasio:

Gracias.`;

  const telefonoSoporte = '573208618664'; // 👈 TU NÚMERO

  const url = `https://wa.me/${telefonoSoporte}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, '_blank');
}
</script>

</body>
</html>
