<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bigger Gym - Acceso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos adicionales para mejorar la interfaz y los formularios */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: rgba(0, 0, 0, 0.6);
    }
    .card {
      background: #1a1a1a;
      color: #fff;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }
    .card h2 {
      margin-bottom: 20px;
      color: #ffd700;
    }
    .card input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #333;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
    }
    .card button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #ffd700;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .card button:hover {
      background: #e6c200;
    }
    .toggle-link, .forgot-link {
      margin-top: 15px;
      font-size: 13px;
      color: #aaa;
      cursor: pointer;
    }
    .toggle-link span, .forgot-link span {
      color: #ffd700;
      text-decoration: underline;
    }
    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="card">
  <h2 id="tituloForm">🔐 Bigger Gym</h2>

  <!-- FORMULARIO DE LOGIN -->
  <div id="seccionLogin">
    <input type="text" id="usuarioLogin" placeholder="Usuario">
    <input type="password" id="passwordLogin" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>
    <p id="errorLogin" style="color:#ff4d4d; font-size:13px; margin-top:10px;"></p>
    
    <div class="forgot-link" onclick="mostrarRecuperacion()">
      ¿Olvidaste tu contraseña?
    </div>
    <div class="toggle-link">
      ¿No tienes cuenta? <span onclick="cambiarVista('registro').click();">Regístrate aquí</span>
    </div>
  </div>

  <!-- FORMULARIO DE REGISTRO -->
  <div id="seccionRegistro" class="hidden">
    <input type="text" id="usuarioRegistro" placeholder="Elige un Usuario">
    <input type="password" id="passwordRegistro" placeholder="Elige una Contraseña">
    <button onclick="registrar()">Crear Cuenta</button>
    <p id="errorRegistro" style="color:#ff4d4d; font-size:13px; margin-top:10px;"></p>
    
    <div class="toggle-link">
      ¿Ya tienes cuenta? <span onclick="cambiarVista('login')">Inicia sesión</span>
    </div>
  </div>

  <!-- FORMULARIO DE RECUPERACIÓN -->
  <div id="seccionRecuperar" class="hidden">
    <p style="font-size: 13px; color: #ccc;">Ingresa tu correo o usuario y te enviaremos instrucciones de recuperación.</p>
    <input type="text" id="usuarioRecuperar" placeholder="Tu Usuario o Correo">
    <button onclick="recuperarPassword()">Enviar Instrucciones</button>
    <p id="errorRecuperar" style="color:#4dff4d; font-size:13px; margin-top:10px;"></p>
    
    <div class="toggle-link" style="margin-top: 15px;">
      <span onclick="cambiarVista('login')">Volver al login</span>
    </div>
  </div>
</div>

<script>
  function cambiarVista(vista) {
    document.getElementById('seccionLogin').classList.add('hidden');
    document.getElementById('seccionRegistro').classList.add('hidden');
    document.getElementById('seccionRecuperar').classList.add('hidden');

    if (vista === 'login') {
      document.getElementById('tituloForm').textContent = '🔐 Bigger Gym';
      document.getElementById('seccionLogin').classList.remove('hidden');
    } else if (vista === 'registro') {
      document.getElementById('tituloForm').textContent = '📝 Nuevo Registro';
      document.getElementById('seccionRegistro').classList.remove('hidden');
    } else if (vista === 'recuperar') {
      document.getElementById('tituloForm').textContent = '🔄 Recuperar Clave';
      document.getElementById('seccionRecuperar').classList.remove('hidden');
    }
  }

  function mostrarRecuperacion() {
    cambiarVista('recuperar');
  }

  async function login() {
    const usuario = document.getElementById('usuarioLogin').value;
    const password = document.getElementById('passwordLogin').value;
    const error = document.getElementById('errorLogin');
    error.textContent = '';

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password })
      });

      if (res.ok) {
        localStorage.setItem('logeado', 'true');
        window.location.href = 'index.html';
      } else {
        error.textContent = 'Usuario o contraseña incorrectos';
      }
    } catch (e) {
      error.textContent = 'Error de conexión con el servidor';
    }
  }

  async function registrar() {
    const usuario = document.getElementById('usuarioRegistro').value;
    const password = document.getElementById('passwordRegistro').value;
    const error = document.getElementById('errorRegistro');
    error.textContent = '';

    if (!usuario || !password) {
      error.textContent = 'Por favor completa todos los campos';
      return;
    }

    try {
      const res = await fetch('/register', { // Asegúrate de crear esta ruta en tu backend (index.js)
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password })
      });

      if (res.ok) {
        alert('¡Cuenta creada con éxito! Ahora puedes iniciar sesión.');
        cambiarVista('login');
      } else {
        error.textContent = 'No se pudo registrar el usuario (tal vez ya exista)';
      }
    } catch (e) {
      error.textContent = 'Error de conexión con el servidor';
    }
  }

  function recuperarPassword() {
    const dato = document.getElementById('usuarioRecuperar').value;
    const mensaje = document.getElementById('errorRecuperar');
    if (!dato) {
      mensaje.style.color = '#ff4d4d';
      mensaje.textContent = 'Ingresa un dato válido';
      return;
    }
    mensaje.style.color = '#4dff4d';
    mensaje.textContent = 'Si el usuario existe, se han enviado instrucciones a su correo.';
  }
</script>

</body>
</html>
