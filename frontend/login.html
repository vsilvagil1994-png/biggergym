<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BiggerGym - Iniciar Sesión</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 380px;
      background: #1c1c1c;
      padding: 35px;
      border-radius: 15px;

      box-shadow:
        0 0 20px rgba(0, 0, 0, 0.5);

      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .logo span {
      color: #ffcc00;
    }

    .subtitulo {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;

      border: none;
      border-radius: 8px;

      background: #2b2b2b;
      color: white;

      outline: none;
      font-size: 14px;
    }

    input:focus {
      border: 1px solid #ffcc00;
      box-shadow: 0 0 5px #ffcc00;
    }

    button {
      width: 100%;
      padding: 13px;

      border: none;
      border-radius: 8px;

      background: #ffcc00;
      color: #111;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition: background 0.3s;
    }

    button:hover {
      background: #e6b800;
    }

    .toggle-link {
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
    }

    .toggle-link span {
      color: #ffcc00;
      cursor: pointer;
    }

    .toggle-link span:hover {
      text-decoration: underline;
    }

    .error {
      color: #ff4d4d;
      font-size: 13px;
      margin-top: 10px;
    }

    .success {
      color: #4dff4d;
      font-size: 13px;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .separador {
      height: 1px;
      background: #333;
      margin: 20px 0;
    }

    .texto-ayuda {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

  </style>

</head>


<body>


  <div class="card">

    <!-- =============================== -->
    <!-- LOGO -->
    <!-- =============================== -->

    <div class="logo">
      Bigger<span>Gym</span>
    </div>

    <div class="subtitulo">
      Sistema de gestión para gimnasio
    </div>


    <!-- =============================== -->
    <!-- LOGIN -->
    <!-- =============================== -->

    <div id="seccionLogin">

      <input
        type="text"
        id="usuarioLogin"
        placeholder="Usuario"
        autocomplete="username"
      >

      <input
        type="password"
        id="passwordLogin"
        placeholder="Contraseña"
        autocomplete="current-password"
      >

      <button onclick="login()">
        Iniciar Sesión
      </button>


      <p
        id="errorLogin"
        class="error"
      ></p>


      <div class="toggle-link">

        ¿No tienes una cuenta?

        <span onclick="cambiarVista('registro')">
          Regístrate aquí
        </span>

      </div>


      <div class="toggle-link">

        <span onclick="cambiarVista('recuperar')">
          ¿Olvidaste tu contraseña?
        </span>

      </div>

    </div>



    <!-- =============================== -->
    <!-- REGISTRO -->
    <!-- =============================== -->

    <div
      id="seccionRegistro"
      class="hidden"
    >

      <input
        type="text"
        id="usuarioRegistro"
        placeholder="Nuevo Usuario"
        autocomplete="username"
      >

      <input
        type="password"
        id="passwordRegistro"
        placeholder="Nueva Contraseña"
        autocomplete="new-password"
      >

      <input
        type="password"
        id="confirmarRegistro"
        placeholder="Confirmar Contraseña"
        autocomplete="new-password"
      >


      <button onclick="registrar()">
        Registrarse
      </button>


      <p
        id="mensajeRegistro"
        class="error"
      ></p>


      <div class="toggle-link">

        ¿Ya tienes una cuenta?

        <span onclick="cambiarVista('login')">
          Inicia sesión aquí
        </span>

      </div>

    </div>



    <!-- =============================== -->
    <!-- RECUPERAR CONTRASEÑA -->
    <!-- =============================== -->

    <div
      id="seccionRecuperar"
      class="hidden"
    >

      <p class="texto-ayuda">

        Ingresa tu usuario para recuperar
        tu contraseña.

      </p>


      <!-- =============================== -->
      <!-- PASO 1: VERIFICAR USUARIO -->
      <!-- =============================== -->

      <div id="pasoVerificar">

        <input
          type="text"
          id="usuarioRecuperar"
          placeholder="Tu Usuario"
          autocomplete="username"
        >


        <button onclick="verificarUsuario()">
          Verificar Usuario
        </button>


        <p
          id="mensajeRecuperar"
          style="font-size:13px; margin-top:10px;"
        ></p>

      </div>



      <!-- =============================== -->
      <!-- PASO 2: NUEVA CONTRASEÑA -->
      <!-- =============================== -->

      <div
        id="pasoNuevaPassword"
        class="hidden"
      >

        <p
          style="
            font-size:13px;
            color:#4dff4d;
            margin-bottom:15px;
          "
        >
          Usuario encontrado ✅
        </p>


        <input
          type="password"
          id="nuevaPassword"
          placeholder="Nueva Contraseña"
          autocomplete="new-password"
        >


        <input
          type="password"
          id="confirmarPassword"
          placeholder="Confirmar Contraseña"
          autocomplete="new-password"
        >


        <button onclick="cambiarPassword()">
          Cambiar Contraseña
        </button>


        <p
          id="mensajeNuevaPassword"
          style="
            font-size:13px;
            margin-top:10px;
          "
        ></p>

      </div>



      <!-- =============================== -->
      <!-- VOLVER AL LOGIN -->
      <!-- =============================== -->

      <div
        class="toggle-link"
        style="margin-top:15px;"
      >

        <span onclick="cambiarVista('login')">
          Volver al login
        </span>

      </div>

    </div>


  </div>



  <script>


    // ==========================================
    // CAMBIAR ENTRE LOGIN / REGISTRO / RECUPERAR
    // ==========================================

    function cambiarVista(vista) {

      const login =
        document.getElementById('seccionLogin');

      const registro =
        document.getElementById('seccionRegistro');

      const recuperar =
        document.getElementById('seccionRecuperar');


      // Ocultar todo

      login.classList.add('hidden');

      registro.classList.add('hidden');

      recuperar.classList.add('hidden');


      // Mostrar la sección seleccionada

      if (vista === 'login') {

        login.classList.remove('hidden');

      }


      if (vista === 'registro') {

        registro.classList.remove('hidden');

      }


      if (vista === 'recuperar') {

        recuperar.classList.remove('hidden');

      }

    }



    // ==========================================
    // LOGIN
    // ==========================================

    async function login() {

      const usuario =
        document
          .getElementById('usuarioLogin')
          .value
          .trim();


      const password =
        document
          .getElementById('passwordLogin')
          .value;


      const error =
        document.getElementById('errorLogin');


      error.textContent = '';


      if (!usuario || !password) {

        error.textContent =
          'Por favor ingresa usuario y contraseña.';

        return;

      }


      try {

        const res = await fetch('/login', {

          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({

            usuario: usuario,

            password: password

          })

        });


        const datos = await res.json();


        if (res.ok) {

          localStorage.setItem(
            'logeado',
            'true'
          );


          localStorage.setItem(
            'usuario',
            datos.usuario || usuario
          );


          window.location.href =
            'index.html';

        }

        else {

          error.textContent =
            datos.mensaje ||
            'Usuario o contraseña incorrectos';

        }


      }

      catch (e) {

        console.error(e);

        error.textContent =
          'Error de conexión con el servidor.';

      }

    }



    // ==========================================
    // REGISTRO
    // ==========================================

    async function registrar() {

      const usuario =
        document
          .getElementById('usuarioRegistro')
          .value
          .trim();


      const password =
        document
          .getElementById('passwordRegistro')
          .value;


      const confirmar =
        document
          .getElementById('confirmarRegistro')
          .value;


      const mensaje =
        document
          .getElementById('mensajeRegistro');


      mensaje.textContent = '';


      if (!usuario || !password || !confirmar) {

        mensaje.className = 'error';

        mensaje.textContent =
          'Completa todos los campos.';

        return;

      }


      if (usuario.length < 3) {

        mensaje.className = 'error';

        mensaje.textContent =
          'El usuario debe tener al menos 3 caracteres.';

        return;

      }


      if (password.length < 4) {

        mensaje.className = 'error';

        mensaje.textContent =
          'La contraseña debe tener al menos 4 caracteres.';

        return;

      }


      if (password !== confirmar) {

        mensaje.className = 'error';

        mensaje.textContent =
          'Las contraseñas no coinciden.';

        return;

      }


      try {

        const res = await fetch('/register', {

          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({

            usuario: usuario,

            password: password

          })

        });


        const datos = await res.json();


        if (res.ok) {

          mensaje.className = 'success';

          mensaje.textContent =
            '✅ Usuario registrado correctamente.';


          document
            .getElementById('usuarioRegistro')
            .value = '';


          document
            .getElementById('passwordRegistro')
            .value = '';


          document
            .getElementById('confirmarRegistro')
            .value = '';


          setTimeout(() => {

            cambiarVista('login');

          }, 1500);

        }

        else {

          mensaje.className = 'error';

          mensaje.textContent =
            datos.mensaje ||
            'No se pudo registrar el usuario.';

        }

      }

      catch (error) {

        console.error(error);

        mensaje.className = 'error';

        mensaje.textContent =
          'Error de conexión con el servidor.';

      }

    }



    // ==========================================
    // VERIFICAR USUARIO PARA RECUPERAR PASSWORD
    // ==========================================

    async function verificarUsuario() {

      const usuario =
        document
          .getElementById('usuarioRecuperar')
          .value
          .trim();


      const mensaje =
        document
          .getElementById('mensajeRecuperar');


      mensaje.textContent = '';


      if (!usuario) {

        mensaje.style.color =
          '#ff4d4d';

        mensaje.textContent =
          'Por favor ingresa tu usuario.';

        return;

      }


      try {

        const res = await fetch(
          '/verificar-usuario',
          {
            method: 'POST',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              usuario: usuario
            })
          }
        );


        const datos = await res.json();


        if (res.ok) {

          mensaje.style.color =
            '#4dff4d';

          mensaje.textContent =
            'Usuario encontrado ✅';


          document
            .getElementById('pasoVerificar')
            .classList.add('hidden');


          document
            .getElementById('pasoNuevaPassword')
            .classList.remove('hidden');

        }

        else {

          mensaje.style.color =
            '#ff4d4d';

          mensaje.textContent =
            datos.mensaje ||
            'El usuario no existe.';

        }

      }

      catch (error) {

        console.error(error);

        mensaje.style.color =
          '#ff4d4d';

        mensaje.textContent =
          'Error de conexión con el servidor.';

      }

    }



    // ==========================================
    // CAMBIAR CONTRASEÑA
    // ==========================================

    async function cambiarPassword() {

      const usuario =
        document
          .getElementById('usuarioRecuperar')
          .value
          .trim();


      const nuevaPassword =
        document
          .getElementById('nuevaPassword')
          .value;


      const confirmarPassword =
        document
          .getElementById('confirmarPassword')
          .value;


      const mensaje =
        document
          .getElementById('mensajeNuevaPassword');


      mensaje.textContent = '';


      // Verificar campos

      if (!nuevaPassword || !confirmarPassword) {

        mensaje.style.color =
          '#ff4d4d';

        mensaje.textContent =
          'Completa los dos campos de contraseña.';

        return;

      }


      // Verificar longitud

      if (nuevaPassword.length < 4) {

        mensaje.style.color =
          '#ff4d4d';

        mensaje.textContent =
          'La contraseña debe tener al menos 4 caracteres.';

        return;

      }


      // Verificar que coincidan

      if (nuevaPassword !== confirmarPassword) {

        mensaje.style.color =
          '#ff4d4d';

        mensaje.textContent =
          'Las contraseñas no coinciden.';

        return;

      }


      try {

        const res = await fetch(
          '/cambiar-password',
          {

            method: 'PUT',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({

              usuario: usuario,

              password: nuevaPassword

            })

          }
        );


        const datos = await res.json();


        if (res.ok) {

          alert(
            '✅ Contraseña cambiada correctamente. Ahora puedes iniciar sesión.'
          );


          // Limpiar campos

          document
            .getElementById('usuarioRecuperar')
            .value = '';


          document
            .getElementById('nuevaPassword')
            .value = '';


          document
            .getElementById('confirmarPassword')
            .value = '';


          // Volver al paso 1

          document
            .getElementById('pasoNuevaPassword')
            .classList.add('hidden');


          document
            .getElementById('pasoVerificar')
            .classList.remove('hidden');


          // Volver al login

          cambiarVista('login');

        }

        else {

          mensaje.style.color =
            '#ff4d4d';

          mensaje.textContent =
            datos.mensaje ||
            'No se pudo cambiar la contraseña.';

        }

      }

      catch (error) {

        console.error(error);

        mensaje.style.color =
          '#ff4d4d';

        mensaje.textContent =
          'Error de conexión con el servidor.';

      }

    }

  </script>


</body>

</html>
